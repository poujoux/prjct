name: Remote Linux

on:
  push:
  workflow_dispatch:


jobs:
  machine:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install numpy scipy scikit-learn Pillow

      - run: |
          echo "---------------LOGS---------------"
          python app.py
          echo "---------------LOGS---------------"
